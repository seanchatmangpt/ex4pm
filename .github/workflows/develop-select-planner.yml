name: DEVELOP Select Planner
on:
  pull_request:
    paths:
      - 'scripts/develop/planner/**'
      - 'receipts/select/2026-08-23-planner.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: for f in scripts/develop/planner/*.exs; do elixir "$f"; done
      - run: elixir -r scripts/develop/planner/*.exs -e 'IO.inspect(Ex4pm.Develop.Planner.HeuristicAdmission.admit([{:a,:b,1}],%{a: 1,b: 0}))'
