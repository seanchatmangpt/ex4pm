name: one-shot-canonical-format

on:
  push:
    branches:
      - feat/v26.8.22-reactor-information-plane

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore(ci): one-shot canonical formatter'
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact subject identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked
      - name: Apply canonical formatter
        run: mix format
      - name: Commit formatter projection
        run: |
          test -n "$(git status --porcelain -- apps config mix.exs .formatter.exs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps config mix.exs .formatter.exs
          git commit -m "style: apply canonical mix formatter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
