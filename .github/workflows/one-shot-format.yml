name: One-shot repository formatter

on:
  push:
    branches:
      - fix/igniter-dev-scope-leak-prod-compile

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'seanchatmangpt'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact pushed subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact pushed subject identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Resolve formatter dependencies
        env:
          MIX_ENV: dev
        run: mix deps.get --check-locked

      - name: Apply repository-native formatter
        env:
          MIX_ENV: dev
        run: mix format

      - name: Refuse semantic expansion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "apps/ex4pm_engine/lib/ex4pm_engine/workflow_net.ex" || {
            echo "::error title=REFUSED:FORMAT_SCOPE_EXPANSION::$changed"
            exit 2
          }

      - name: Commit deterministic formatter projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/ex4pm_engine/lib/ex4pm_engine/workflow_net.ex
          git commit -m "style: apply repository formatter to workflow net"
          git push origin HEAD:fix/igniter-dev-scope-leak-prod-compile
