name: format-calibration-branch

on:
  push:
    branches:
      - scheduled/dmedi-define-evidence-calibration-20260822

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SUBJECT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SUBJECT_SHA }}
          fetch-depth: 0
      - name: Verify exact formatter subject
        run: test "$(git rev-parse HEAD)" = "$EX4PM_SUBJECT_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked
      - name: Apply canonical formatter
        run: mix format
      - name: Commit formatter projection
        run: |
          if git diff --quiet; then
            echo "formatter produced no diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps config mix.exs .formatter.exs
          git commit -m "style: apply canonical Elixir formatter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
