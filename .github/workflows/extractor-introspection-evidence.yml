name: extractor-introspection-evidence

on:
  pull_request:
    paths:
      - 'apps/ex4pm_core/lib/ex4pm_core/extractor/evidence/**'
      - 'apps/ex4pm_core/test/extractor_evidence_*_test.exs'
      - '.github/workflows/extractor-introspection-evidence.yml'
  push:
    branches:
      - 'scheduled/dmedi-define-introspection-evidence'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SUBJECT_SHA }}
          persist-credentials: false

      - name: Admit exact head
        run: test "$(git rev-parse HEAD)" = "$EX4PM_SUBJECT_SHA"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Resolve locked dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Compile exact subject
        run: mix compile --warnings-as-errors

      - name: Run focused extractor evidence falsifiers
        run: mix test apps/ex4pm_core/test/extractor_evidence_*_test.exs

      - name: Run canonical core regression court
        run: mix test apps/ex4pm_core/test

      - name: Check formatting
        run: mix format --check-formatted
