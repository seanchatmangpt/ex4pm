name: DEVELOP Select Semantic
on:
  pull_request:
    paths:
      - 'scripts/develop/semantic/**'
      - 'receipts/select/2026-08-23-semantic.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: for f in scripts/develop/semantic/*.exs; do elixir "$f"; done
      - run: elixir -r scripts/develop/semantic/*.exs -e 'IO.inspect(Ex4pm.Develop.Semantic.SemilatticeLaws.verify([MapSet.new(),MapSet.new([:x])],&MapSet.union/2))'
