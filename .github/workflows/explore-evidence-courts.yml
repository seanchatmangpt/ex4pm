name: explore-evidence-courts
on:
  pull_request:
    paths:
      - 'scripts/explore/evidence/**'
      - '.github/workflows/explore-evidence-courts.yml'
permissions:
  contents: read
jobs:
  evidence-courts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Verify exact subject and execute evidence courts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          count=0
          for court in scripts/explore/evidence/*.exs; do
            elixir "$court"
            count=$((count+1))
          done
          test "$count" -ge 8
