name: Cloud Contract Formatter Repair

on:
  push:
    branches: [feat/chatgpt-cloud-execution-contract]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-cloud-execution-contract
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked

      - name: Apply canonical formatter
        run: mix format

      - name: Commit formatter-owned paths
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps config mix.exs .formatter.exs; then
            echo 'formatter produced no changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps config mix.exs .formatter.exs
          git commit -m 'style: apply Elixir 1.18.4 formatter'
          git push origin HEAD:feat/chatgpt-cloud-execution-contract
