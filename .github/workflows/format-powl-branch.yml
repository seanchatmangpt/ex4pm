name: format-powl-branch

on:
  push:
    branches:
      - feat/powl-paper-doctests-utf8

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SUBJECT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SUBJECT_SHA }}
          fetch-depth: 0
      - name: Verify exact formatter subject
        run: test "$(git rev-parse HEAD)" = "$EX4PM_SUBJECT_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked
      - name: Apply canonical formatter to POWL change surface only
        run: |
          mix format \
            apps/ex4pm/test/chicago/global_beam_test.exs \
            apps/ex4pm/test/test_helper.exs \
            apps/ex4pm_core/lib/ex4pm/powl.ex \
            apps/ex4pm_core/test/powl_doctest_test.exs \
            apps/ex4pm_engine/lib/ex4pm_engine/powl.ex \
            apps/ex4pm_engine/test/engine_test.exs \
            apps/ex4pm_engine/test/powl_doctest_test.exs \
            apps/ex4pm_engine/test/powl_test.exs
      - name: Commit bounded formatter projection
        run: |
          if git diff --quiet; then
            echo "formatter produced no diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/ex4pm/test/chicago/global_beam_test.exs \
            apps/ex4pm/test/test_helper.exs \
            apps/ex4pm_core/lib/ex4pm/powl.ex \
            apps/ex4pm_core/test/powl_doctest_test.exs \
            apps/ex4pm_engine/lib/ex4pm_engine/powl.ex \
            apps/ex4pm_engine/test/engine_test.exs \
            apps/ex4pm_engine/test/powl_doctest_test.exs \
            apps/ex4pm_engine/test/powl_test.exs
          git commit -m "style: apply bounded POWL formatter projection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
