name: ex4pm-ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SUBJECT_SHA }}

      - name: Verify exact subject identity
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'admitted=%s\nobserved=%s\n' "$EX4PM_SUBJECT_SHA" "$actual"
          test "$actual" = "$EX4PM_SUBJECT_SHA"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run umbrella tests
        run: mix test

      - name: Run Chicago global BEAM crown
        run: mix chicago

      - name: Manufacture Chicago execution receipt
        run: |
          mkdir -p .ci
          export EX4PM_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          mix run -e '
            receipt = %{
              source_sha: System.fetch_env!("EX4PM_SUBJECT_SHA"),
              tree_sha: System.fetch_env!("EX4PM_TREE_SHA"),
              command: "mix chicago",
              exit_status: 0,
              topology: "three same-host OTP peer nodes plus origin",
              environment: Ex4pm.Qualification.environment(),
              network_security: Ex4pm.Runtime.Distributed.security_posture()
            }
            File.write!(".ci/chicago-receipt.json", Jason.encode!(receipt, pretty: true))
          '

      - name: Upload Chicago receipt
        uses: actions/upload-artifact@v4
        with:
          name: chicago-receipt-${{ env.EX4PM_SUBJECT_SHA }}
          path: .ci/chicago-receipt.json
          if-no-files-found: error

      - name: Check formatting
        id: format
        run: mix format --check-formatted

      - name: Manufacture formatting diagnostic
        if: failure() && steps.format.outcome == 'failure'
        run: |
          mix format
          mkdir -p .ci
          git diff -- . > .ci/format.patch
          cat .ci/format.patch

      - name: Upload formatting patch
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch-${{ env.EX4PM_SUBJECT_SHA }}
          path: .ci/format.patch
          if-no-files-found: error

      - name: Upload formatter-produced source
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source-${{ env.EX4PM_SUBJECT_SHA }}
          path: |
            apps
            config
            mix.exs
            .formatter.exs
          if-no-files-found: error

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mix-lock-${{ env.EX4PM_SUBJECT_SHA }}
          path: mix.lock
          if-no-files-found: error

  chicago-tls-distribution:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SUBJECT_SHA }}

      - name: Verify exact subject identity
        run: test "$(git rev-parse HEAD)" = "$EX4PM_SUBJECT_SHA"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve exact locked dependencies
        run: mix deps.get --check-locked

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Manufacture ephemeral TLS distribution identity
        run: |
          mkdir -p .ci/tls
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$PWD/.ci/tls/key.pem" \
            -out "$PWD/.ci/tls/cert.pem" \
            -days 1 \
            -subj '/CN=ex4pm-chicago'
          cat > "$PWD/.ci/tls/ssl_dist.conf" <<CONF
          [{server,[{certfile,"$PWD/.ci/tls/cert.pem"},
                    {keyfile,"$PWD/.ci/tls/key.pem"},
                    {verify,verify_none}]},
           {client,[{verify,verify_none}]}].
          CONF
          echo "ERL_AFLAGS=-proto_dist inet_tls -ssl_dist_optfile $PWD/.ci/tls/ssl_dist.conf" >> "$GITHUB_ENV"

      - name: Run Chicago crown over TLS Erlang distribution
        run: mix chicago

      - name: Manufacture TLS Chicago receipt
        run: |
          export EX4PM_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          mix run -e '
            receipt = %{
              source_sha: System.fetch_env!("EX4PM_SUBJECT_SHA"),
              tree_sha: System.fetch_env!("EX4PM_TREE_SHA"),
              command: "mix chicago",
              exit_status: 0,
              topology: "three same-host OTP peer nodes plus origin over inet_tls",
              environment: Ex4pm.Qualification.environment(),
              network_security: Ex4pm.Runtime.Distributed.security_posture()
            }
            File.write!(".ci/tls/chicago-tls-receipt.json", Jason.encode!(receipt, pretty: true))
          '

      - name: Upload TLS Chicago receipt
        uses: actions/upload-artifact@v4
        with:
          name: chicago-tls-receipt-${{ env.EX4PM_SUBJECT_SHA }}
          path: .ci/tls/chicago-tls-receipt.json
          if-no-files-found: error
