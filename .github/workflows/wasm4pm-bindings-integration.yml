name: wasm4pm-ex4pm-bindings integration (real wasm, all 33 algorithms)

on:
  pull_request:
    paths:
      - "lib/ex4pm/engine.ex"
      - "lib/ex4pm_engine/wasm/**"
      - "lib/ex4pm/qualification/exposure_court.ex"
      - "priv/wasm4pm/**"
      - "priv/ferroplan/**"
      - "priv/ontology/ex4pm.ttl"
      - "test/wasm/**"
      - "test/reactors/**"
      - "test/exposure_court_test.exs"
      - ".github/workflows/wasm4pm-bindings-integration.yml"
  push:
    branches:
      - "feat/ex4pm-wasm4pm-bindings-phase1"
      - "feat/wasm4pm-phase1-bindings"
      - "feat/ex4pm-wasm4pm-bindings-phase2"
      - "feat/wasm4pm-phase2-bindings"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bindings-cross-repo:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX4PM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EX4PM_SOURCE_SHA }}

      - name: Verify exact ex4pm source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EX4PM_SOURCE_SHA"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve exact ex4pm lock and compile
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors

      # The single source of truth for the wasm4pm source pin is the bundled
      # artifact's MANIFEST (no second hand-maintained SHA in this file).
      - name: Read wasm4pm source pin and artifact sha256 from priv/wasm4pm/MANIFEST.json
        shell: bash
        run: |
          set -euo pipefail
          echo "WASM4PM_BINDINGS_SHA=$(jq -r .provenance.source_commit priv/wasm4pm/MANIFEST.json)" >> "$GITHUB_ENV"
          echo "MANIFEST_WASM_SHA256=$(jq -r .artifact.sha256 priv/wasm4pm/MANIFEST.json)" >> "$GITHUB_ENV"

      - name: Checkout exact wasm4pm-ex4pm-bindings source
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/wasm4pm
          ref: ${{ env.WASM4PM_BINDINGS_SHA }}
          path: .ci/wasm4pm
          fetch-depth: 1

      - name: Verify exact wasm4pm source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/wasm4pm rev-parse HEAD)" = "$WASM4PM_BINDINGS_SHA"

      # Must match wasm4pm's rust-toolchain.toml pin (nightly-2026-04-15).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          targets: wasm32-unknown-unknown

      - name: Run native crate tests
        run: cargo test -p wasm4pm-ex4pm-bindings
        working-directory: .ci/wasm4pm

      # The committed build script links the staticlib with rust-lld and exports
      # only the crate's `export_name` allowlist, producing a zero-import
      # artifact. It fails if the output has any wasm imports or a missing export.
      - name: Build real wasm32-unknown-unknown release artifact (build-wasm.sh)
        run: bash crates/wasm4pm-ex4pm-bindings/scripts/build-wasm.sh
        working-directory: .ci/wasm4pm

      - name: Hash the built artifact and compare to the priv/wasm4pm/MANIFEST.json pin
        shell: bash
        run: |
          set -euo pipefail
          built=".ci/wasm4pm/target/wasm32-unknown-unknown/release/wasm4pm_ex4pm_bindings.wasm"
          sha256sum "$built" | awk '{print $1}' > .ci/wasm4pm-bindings-wasm.sha256
          echo "built    = $(cat .ci/wasm4pm-bindings-wasm.sha256)"
          echo "manifest = $MANIFEST_WASM_SHA256"
          # Reproducibility gate: a rebuild from the pinned source must equal the
          # bundled artifact byte for byte. A mismatch fails (no silent re-pin).
          test "$(cat .ci/wasm4pm-bindings-wasm.sha256)" = "$MANIFEST_WASM_SHA256"
          echo "EX4PM_WASM_ARTIFACT=$PWD/$built" >> "$GITHUB_ENV"
          echo "EX4PM_WASM_SHA256=$MANIFEST_WASM_SHA256" >> "$GITHUB_ENV"
          echo "EX4PM_WASM_REQUIRED=1" >> "$GITHUB_ENV"

      # Build happens BEFORE the tests: with the built artifact exported and
      # EX4PM_WASM_REQUIRED=1, an absent artifact FAILS instead of skipping.
      - name: Real wasm tests (all 33 algorithms, real Wasmex, replay verified)
        run: mix test test/wasm/ test/reactors/ --include real_wasm

      - name: Exposure court, real execution mode
        run: mix ex4pm.exposure.court --require-real

      - name: Upload cross-repository receipt evidence
        uses: actions/upload-artifact@v4
        with:
          name: ex4pm-wasm4pm-bindings-${{ env.EX4PM_SOURCE_SHA }}
          path: |
            .ci/wasm4pm-bindings-wasm.sha256
            .ci/wasm4pm/target/wasm32-unknown-unknown/release/wasm4pm_ex4pm_bindings.wasm
          if-no-files-found: error
          retention-days: 14
